<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<meta name="robots" content="noindex,nofollow">
<title>Salama Check-In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17211f;--muted:#5a6a66;--line:#d9e1de;--brand:#0f6b63;--brand-ink:#fff;--brand-soft:#e1f1ee;
  --g:#2f855a;--g-soft:#e3f4ea;--y:#8a6a00;--y-soft:#fbf1cf;--o:#b45309;--o-soft:#fde8d0;--r:#b42318;--r-soft:#fde4e1;--focus:#1d4ed8;--radius:14px}
@media (prefers-color-scheme: dark){:root{--bg:#0e1514;--card:#16201e;--ink:#e8f0ee;--muted:#9db0ab;--line:#2a3a37;--brand:#3fb5a7;--brand-ink:#06201d;--brand-soft:#16302c;
  --g:#6fd3a0;--g-soft:#143323;--y:#f0c94a;--y-soft:#3a3010;--o:#f4a25a;--o-soft:#3b2410;--r:#ff8a7d;--r-soft:#401a16;--focus:#8ab4ff}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
body.embedphone .langsw{display:none}
header.top .logo{font-weight:700;font-size:1.05rem;flex:1}header.top .logo small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
button,.btn{font:inherit;cursor:pointer}
.exit{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.demo{background:var(--y-soft);color:var(--y);font-size:.85rem;padding:6px 16px;text-align:center}
h1{font-size:1.45rem;line-height:1.25;margin:.2em 0 .4em}h2{font-size:1.15rem;margin:1.2em 0 .4em}p{margin:.4em 0 .8em}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:380px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;color:inherit;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:1.02rem}.tile .ic{font-size:1.4rem;line-height:1}
.tile.primary{grid-column:1/-1;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);min-height:0}.tile.primary .muted{color:inherit;opacity:.92}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:650}
.btn.secondary{background:transparent;color:var(--brand)}.btn.danger{background:var(--r);border-color:var(--r);color:#fff}.btn.block{display:flex;width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
fieldset{border:0;margin:0 0 18px;padding:0}legend{font-weight:600;padding:0;margin-bottom:8px}
.opts{display:grid;gap:8px}.opts.grid11{grid-template-columns:repeat(6,1fr)}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:48px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:0}.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opts.grid11 .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:8px 4px;font-size:.9rem}
.err{border-left:4px solid var(--r);padding-left:10px}.errmsg{color:var(--r);font-weight:600;margin:6px 0}
textarea,select,input[type=text],input[type=tel]{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}.progress>i{display:block;height:100%;background:var(--brand)}
.stepper{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.zone{border-radius:var(--radius);padding:18px;border:2px solid;margin:10px 0}.zone h1{margin:0 0 .2em}
.zone.z1{background:var(--g-soft);border-color:var(--g)}.zone.z2{background:var(--y-soft);border-color:var(--y)}.zone.z3{background:var(--o-soft);border-color:var(--o)}.zone.z4{background:var(--r-soft);border-color:var(--r)}
.zonebar{display:flex;gap:4px;margin:10px 0 0}.zonebar span{flex:1;text-align:center;font-size:.72rem;padding:4px 2px;border-radius:6px;background:var(--line);color:var(--muted)}
.zonebar span.on{color:#fff;font-weight:700}.zonebar .b1.on{background:var(--g)}.zonebar .b2.on{background:var(--y)}.zonebar .b3.on{background:var(--o)}.zonebar .b4.on{background:var(--r)}
.safety{background:var(--r-soft);border:2px solid var(--r);border-radius:var(--radius);padding:14px;margin:12px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.line a{font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap}
.banner{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
table.scores{width:100%;border-collapse:collapse;font-size:.92rem}table.scores td{padding:6px 0;border-top:1px solid var(--line)}table.scores td:last-child{text-align:right;font-weight:650}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:6px 0;font-weight:600;text-align:left}
footer.fine{max-width:640px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
.back{background:none;border:0;color:var(--brand);font-weight:650;padding:6px 0;margin-bottom:4px}
ul.clean,ol.clean{padding-left:1.15em;margin:.3em 0 .8em}ul.clean li,ol.clean li{margin:.4em 0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:650;background:var(--brand-soft);color:var(--brand)}
.neutral{max-width:640px;margin:60px auto;padding:16px;font-family:Georgia,serif}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Demo mode: nothing leaves this device. The nurse console and exports work in this browser only.</div>
<header class="top"><div class="logo">Salama Check-In<small>Private. Screening, not diagnosis.</small></div>
  <span data-langsw></span>
  <button class="exit" id="exitBtn" aria-label="Quick exit: leave this page now">Quick exit</button></header>
<main id="app" tabindex="-1"><noscript>This app needs JavaScript.</noscript></main>
<footer class="fine">Salama gives information and screening, not a diagnosis. In an emergency call the police or emergency line, or go to the nearest health facility.
  <br><button class="link small" id="helpNow">I need help now</button></footer>

<script src="config.js"></script>
<script src="lang_sw.js"></script>
<script src="lang.js"></script>
<script>/*__INJECT__*/</script>
<script>/*__SHARED__*/</script>
<script>
"use strict";
const $app = document.getElementById("app"); const E = Util.esc;
const NS = new URLSearchParams(location.search).get("ns") || "";           // the portal runs several copies side by side; each keeps its own profile
window.PROFILE_KEY = "salama_profile" + (NS ? "_" + NS : ""); const DRAFT = "salama_draft_" + (NS ? NS + "_" : "");
if (new URLSearchParams(location.search).get("embed") === "phone") document.body.classList.add("embedphone");
let P = Store.get(PROFILE_KEY, null); const S = {};
const save = () => { Util.emit("stored", "Settings and results saved on this phone only"); return Store.set(PROFILE_KEY, P); };
const zoneInfo = {
  1: ["Coping well", "Your answers suggest you are coping well right now. Keep doing what works, and check in again in about 4 weeks."],
  2: ["Feeling the strain", "You are showing some signs of strain. This is common, and it is a good time to act early with small steps."],
  3: ["Struggling", "Your answers suggest you are struggling. Talking to a nurse in the next few days is a good idea. You do not have to wait until it gets worse."],
  4: ["Needs care now", "Your answers suggest you need support now. Please talk to a nurse or someone you trust today."]
};
let LESSONS = CONTENT.lessons.slice(); let NAV = CONTENT.navigator.slice(); let REMOTE = { banner: null };

/* ---------- router (so the phone Back button works) ---------- */
const views = {};
function go(v, p, replace) { const st = { v, p: p || {} }; if (replace) history.replaceState(st, ""); else history.pushState(st, ""); render(st); }
window.addEventListener("popstate", e => render(e.state || { v: "home", p: {} }));
function render(st) { Util.emit("screen", st.v); const f = views[st.v] || views.home; window.scrollTo(0, 0); S.view = st.v; f(st.p || {}); $app.focus({ preventScroll: true }); }
function back() { history.length > 1 ? history.back() : go("home"); }
$app.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (!b) return; const d = b.dataset; go(d.go, { form: d.form, id: d.id, code: d.code, ctx: d.ctx, reason: d.reason }); });

document.getElementById("exitBtn").addEventListener("click", () => {
  document.title = "Weather";
  document.body.innerHTML = '<div class="neutral"><h1>Weather</h1><p>Nairobi: partly cloudy, 22°C.</p><p>Tomorrow: light rain in the afternoon.</p></div>';
  history.replaceState({}, "", location.pathname);
  setTimeout(() => location.replace("https://www.google.com/search?q=weather+nairobi"), 400);
});
document.getElementById("helpNow").addEventListener("click", () => go("safety"));

/* ---------- helpers ---------- */
function linesHtml() {
  return (CFG.LOCAL_CONTACTS || []).concat(CFG.NATIONAL_LINES || []).map(x =>
    `<div class="line"><span>${E(x.label)}<br><span class="muted small">${E(x.note || "")}</span></span>${x.tel ? `<a href="tel:${E(x.tel)}">${E(x.value || x.tel)}</a>` : `<span class="muted">${E(x.value || "")}</span>`}</div>`).join("");
}
function safetyBlock(title) { return `<div class="safety" role="alert"><b>${E(title || "If you or someone else is in danger")}</b><p class="small">Call the police or emergency line now, or go to the nearest health facility. You can also reach a person on these lines.</p>${linesHtml()}</div>`; }
const currentWeek = () => Math.floor(Date.now() / (7 * 864e5));
const daysAgo = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : null;
const lessonById = id => LESSONS.find(x => x.id === id);

/* ================================================================== PIN LOCK (keeps casual eyes off this phone; it does not encrypt) */
const Pin = {
  get() { return Store.get("salama_pin", null); },
  async hash(pin, salt) { const b = new TextEncoder().encode(salt + ":" + pin); const d = await crypto.subtle.digest("SHA-256", b); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join(""); },
  async set(pin) { const salt = Util.uuid(); Store.set("salama_pin", { salt, hash: await this.hash(pin, salt), tries: 0 }); },
  async check(pin) { const p = this.get(); if (!p) return true; return (await this.hash(pin, p.salt)) === p.hash; },
  clear() { Store.del("salama_pin"); }
};
let UNLOCKED = false;
views.lock = function () {
  const p = Pin.get(); const left = Math.max(0, 5 - (p ? p.tries || 0 : 0));
  $app.innerHTML = `<h1>Enter your PIN</h1><p class="muted">This phone is locked so that nobody else sees your results.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" style="width:100%;font-size:1.4rem;letter-spacing:6px;text-align:center">
  <p id="pinErr" class="errmsg" hidden></p><button class="btn block" id="pinGo">Unlock</button>
  <p class="small muted">Forgot it? You can erase this phone's data and start again. Your private code and results on this phone will be lost.</p><button class="link small" id="pinForgot">Forgot my PIN: erase this phone's data</button>`;
  const go_ = async () => { const v = document.getElementById("pin").value; const e = document.getElementById("pinErr"); const p2 = Pin.get();
    if (await Pin.check(v)) { UNLOCKED = true; p2.tries = 0; Store.set("salama_pin", p2); Util.emit("stored", "Phone unlocked"); go("home", {}, true); }
    else { p2.tries = (p2.tries || 0) + 1; Store.set("salama_pin", p2); e.hidden = false; e.textContent = p2.tries >= 5 ? "Too many wrong tries. Use the erase option below." : "That PIN is not right."; } };
  document.getElementById("pinGo").onclick = go_; document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") go_(); });
  document.getElementById("pinForgot").onclick = () => { if (confirm("Erase your code, results and settings from this phone?")) { Object.keys(localStorage).filter(k => k.startsWith("salama_") && k !== "salama_demo_db" && k !== "salama_lang").forEach(k => localStorage.removeItem(k)); P = null; location.href = location.pathname; } };
};

/* ================================================================== WELCOME */
views.welcome = function () {
  const q = new URLSearchParams(location.search); const unitQ = q.get("unit"), roleQ = q.get("role");
  const unitOk = CFG.UNITS.find(u => u.code === unitQ);
  const ROLES = (CFG.EXPERT_LINK && roleQ === "informant") ? ["informant"] : (CFG.ROLES || ["student"]);
  $app.innerHTML = `<h1>A private check-in for how you are doing</h1>
  <p>Answer a few questions on your phone, see a result only you can read, and, if you choose, ask a nurse to contact you.</p>
  <div class="card"${ROLES.length === 1 ? " hidden" : ""}><fieldset><legend>I am</legend><div class="opts" id="roleOpts">
    ${ROLES.map(r => ({ student: "A student of the Defence College of Health Sciences (DCHS), or an applicant, 18 or older", personnel: "A serving member", family: "A family member of someone serving (18 or older)", informant: "A nurse, clinician, chaplain, welfare officer, commander or other expert (expert questionnaire)" }[r] ? `<label class="opt"><input type="radio" name="role" value="${r}" ${(roleQ === r || ROLES.length === 1) ? "checked" : ""}><span>${{ student: "A student of the Defence College of Health Sciences (DCHS), or an applicant, 18 or older", personnel: "A serving member", family: "A family member of someone serving (18 or older)", informant: "A nurse, clinician, chaplain, welfare officer, commander or other expert (expert questionnaire)" }[r]}</span></label>` : "")).join("")}</div></fieldset>
    <fieldset id="unitBox"><legend>My unit group (so the pilot can report on groups, never on you)</legend>
      <select id="unit">${CFG.UNITS.map(u => `<option value="${E(u.code)}" ${unitOk && unitOk.code === u.code ? "selected" : ""}>${E(u.label)}</option>`).join("")}</select></fieldset></div>
  <div class="card" id="protect" style="border-color:var(--brand)"><b>Your protections</b><ul class="clean small">
    <li><b>You choose.</b> You can say no, skip any question, or stop at any time. Nothing will happen to you.</li>
    <li><b>This is not an assessment.</b> It does not affect your marks, progression, discipline, sponsorship, posting or place.</li>
    <li><b>No name.</b> No name, admission number, service number or phone number is stored with your answers. You get a random private code.</li>
    <li><b>Staff cannot see you.</b> Lecturers, commanders and college managers never see individual answers. Results are reported for groups of 10 or more only.</li>
    <li><b>Your result is yours.</b> Only you see it. A colour goes to the support office only if you choose to share it, and you can withdraw it.</li>
    <li><b>Help is close.</b> Help numbers are on every result. A nurse can contact you if you ask.</li>
    <li><b>Approved and supervised.</b> ${E(CFG.ETHICS_REF || "Ethics approval number: [to be added]")}. Researcher: WEDAH, BSc Nursing with Military Health, DCHS. ${E(CFG.CONTACT_TEXT || "Contacts: [to be added]")}. The study follows the Data Protection Act, 2019.</li>
    <li><b>One limit.</b> If you tell a nurse that you or someone else is in immediate danger, the nurse may need to act to keep people safe. Answers already sent cannot be traced back to you, so they cannot be removed one by one.</li></ul></div>
  <div class="card" id="consents"><b>How your information is used</b><ul class="clean small">
    <li>No name or service number is collected. You get a random private code on this phone.</li>
    <li>Your answers are scored on this phone first. You see your result before anything is shared.</li>
    <li>Commanders and supervisors never see individual information. Group figures are hidden when a group is small.</li>
    <li>Using the app is voluntary and has no effect on your service or your family.</li>
    <li id="apNote" hidden><b>Students and applicants:</b> this is not an assessment or an admission test. Your detailed answers go only to the research team, anonymously. At the end you may choose to share one colour (green, amber or red) with the college student-support office so they can offer help. Doing or skipping any of this changes nothing about your marks, progress, place or application.</li></ul>
    <label class="opt"><input type="checkbox" id="cUsage"><span class="small">Share anonymous usage counts (which parts of the app are opened, never what you type).</span></label><div style="height:8px"></div>
    <label class="opt"><input type="checkbox" id="cAnswers"><span class="small">Share my anonymous check-in and pulse answers for the pilot evaluation. I can switch this off later in Settings.</span></label></div>
  <details class="card small" id="haveCode"><summary><b>I already have a code</b></summary><p class="muted">If you have used Salama before, type your private code to carry on with the same history. It looks like STUD-0001 or AB3K-7QXM.</p><input id="oldCode" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="9" placeholder="STUD-0001" style="width:100%"></details>
  <p id="wErr" class="errmsg" hidden></p><button class="btn block" id="startBtn">Continue</button>
  <p class="small muted">You can use the app without ticking the boxes. The check-in result and the nurse call-back still work.</p>`;
  const role = () => (document.querySelector("input[name=role]:checked") || {}).value;
  const sync = () => { const r = role(); document.getElementById("apNote").hidden = r !== "student"; document.getElementById("consents").hidden = r === "informant"; document.getElementById("unitBox").hidden = r === "informant"; };
  document.getElementById("roleOpts").addEventListener("change", sync); sync();
  document.getElementById("startBtn").onclick = async () => {
    const r = role(); const err = document.getElementById("wErr");
    if (!r) { err.hidden = false; err.textContent = "Please choose who you are."; return; }
    P = P || {}; P.grp = r; if (r === "student") P.apContext = ["selection", "orientation", "baseline", "followup"].includes(q.get("ctx")) ? q.get("ctx") : "baseline"; P.unit_code = r === "informant" ? null : document.getElementById("unit").value;
    if (r !== "informant" && !P.anon_code && !(document.getElementById("oldCode").value || "").trim()) { const b = document.getElementById("startBtn"); b.disabled = true; b.textContent = "Getting your private code…"; P.anon_code = (await Api.issueId(r)) || (Util.code(4) + "-" + Util.code(4)); b.disabled = false; b.textContent = "Continue"; }
    if (r === "informant") P.anon_code = null;
    P.consentUsage = r !== "informant" && document.getElementById("cUsage").checked; P.consentAnswers = r !== "informant" && document.getElementById("cAnswers").checked;
    const oc = (document.getElementById("oldCode").value || "").trim().toUpperCase();
    if (oc) { if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(oc)) { err.hidden = false; err.textContent = "That code does not look right. It has 4 letters or numbers, a dash, then 4 more."; return; } P.anon_code = oc; }
    P.created = P.created || new Date().toISOString(); P.done = P.done || {}; P.tickets = P.tickets || []; P.checkins = P.checkins || 0; P.hasProfile = true; save();
    if (r === "informant") { P.informantForm = q.get("form") === "delphi" ? "delphi" : "informant"; save(); go("studyConsent", { form: P.informantForm }, true); } else if (r === "student" && q.get("go") === "survey") go("studyConsent", { form: "student_screen" }, true); else go("home", {}, true);
  };
};

/* ================================================================== HOME */
views.home = function () {
  if (!P || !P.hasProfile) return views.welcome();
  if (P.grp === "informant") { const f = P.informantForm || "informant"; if (P.done && P.done[f]) return views.done({ title: "Thank you", text: "Your questionnaire has been received. You can close this page.", home: false }); return go("studyConsent", { form: f }, true); }
  Api.event("app_open", new Date().toISOString().slice(0, 10)); Api.flush();
  const L = LESSONS[currentWeek() % LESSONS.length]; const last = daysAgo(P.lastCheckin);
  const pulseDue = !P.lastPulse || daysAgo(P.lastPulse.at) >= 7;
  const buddyDue = P.buddyRemind && new Date(P.buddyRemind) <= new Date();
  const baseForm = P.grp === "family" ? "baseline_family" : "baseline_personnel"; const todo = [];
  const ap = P.grp === "student"; const apCtx = apNext();
  if (!ap && !(P.done || {})[baseForm]) todo.push(`<button class="link" data-go="studyConsent" data-form="${baseForm}">Answer the short baseline questions (${INSTRUMENT[baseForm].minutes} min) to help shape the service</button>`);
  if (!ap && P.checkins > 0) todo.push(`<button class="link" data-go="studyConsent" data-form="usability_end">Give end-of-pilot feedback (${INSTRUMENT.usability_end.minutes} min)</button>`);
  const fy = forYou();
  $app.innerHTML = `<h1>How are you doing?</h1>
  ${REMOTE.banner ? `<div class="banner">${E(REMOTE.banner)}</div>` : ""}
  ${buddyDue ? `<div class="banner"><b>Buddy check.</b> You planned to check on a buddy. A short message today is enough. <button class="link" data-go="buddy">Open tips</button></div>` : ""}
  ${fy.length ? `<div class="card"><b>For you</b>${fy.map(x => `<div class="line"><span class="small">${E(x.t)}</span><button class="link" data-go="${x.go}" data-id="${E(x.id || "")}" data-reason="${E(x.reason || "")}">${E(x.label)}</button></div>`).join("")}</div>` : ""}
  <div class="tiles">
    ${ap && apCtx ? `<button class="tile primary" data-go="studyConsent" data-form="student_screen"><span class="ic">✔</span><b>${apLabel(apCtx)}</b><span class="muted small">About 12 minutes. Private. Your lecturers and commanders never see it. It does not affect your marks or progress.</span></button>` : ""}
    <button class="tile ${ap && apCtx ? "" : "primary"}" data-go="pulseStart"><span class="ic">♡</span><b>Weekly pulse ${pulseDue ? '<span class="pill" style="background:#fff;color:#0f6b63">due</span>' : ""}</b><span class="muted small">One minute. What is weighing on you this week.</span></button>
    <button class="tile" data-go="checkinStart"><span class="ic">✔</span><b>Private check-in</b><span class="muted small">${last === null ? "About 8 minutes. Result on this phone only." : `Last done ${last === 0 ? "today" : last + " days ago"}. Every 4 weeks works well.`}</span></button>
    <button class="tile" data-go="helpHub"><span class="ic">☎</span><b>Get help</b><span class="muted small">Talk to a person, get referred, or ask the guide.</span></button>
    <button class="tile" data-go="ask"><span class="ic">✉</span><b>Ask the nurse</b><span class="muted small">Anonymous question. Answer in the app.</span></button>

const CRISIS = /\b(kill myself|suicid\w*|end my life|end it all|want to die|better off dead|hurt myself|harm myself|self[- ]harm|cut myself|overdose|no reason to live|can'?t go on|take my life)\b|kujiua|nataka kufa|nijiue|kujidhuru|ninataka kufa/i;
const DANGER = /\b(beat(s|ing)? me|hit(s|ting)? me|rape\w*|abus\w+|threaten(s|ed)? to kill|he will kill|she will kill|forced me|sexual(ly)? assault\w*)\b|kunipiga|ubakaji|amenibaka/i;
const TOPICS = [
  [/sleep|insomnia|cannot sleep|can'?t sleep|tired|nightmare|usingizi/i, "sleep", "Sleep"],
  [/exam|placement|grade|fail(ing)?|study|assignment|cat\b/i, "exams", "Exam and placement stress"],
  [/stress|overwhelm|panic|anxious|anxiety|worr(y|ied)|nervous|pressure|wasiwasi/i, "stress", "Stress and worry"],
  [/id card|atm|collateral|security|held by|lost (my )?(id|card)|pledge|kadi/i, "idcard", "A lender holding a card"],
  [/loan|debt|shylock|lender|owe|borrow|money|fees|salary|pay\b|deduction|deni|pesa/i, "money", "Money and debt"],
  [/angry|anger|fight|shout|temper|wife|husband|partner|violence|home\b|nyumbani/i, "anger", "Anger and home"],
  [/drink|beer|alcohol|drunk|pombe|chang'?aa/i, "alcohol", "Alcohol"],
  [/died|death|funeral|grief|bereave|lost (a|my) (friend|colleague|brother|sister|parent)|msiba/i, "loss", "Loss and grief"],
  [/news|social media|facebook|tiktok|x\.com|twitter|video|online/i, "online", "News and social media"],
  [/quit|drop(ping)? out|leave (the )?(college|programme|course)|withdraw|defer|start(ing)? at|new (student|here)/i, "dchs_start", "Starting at DCHS"],
  [/family|miss (home|my)|away from|deploy/i, "family", "Staying close while apart"]
];
function referralLinks() {
  const mk = x => { const links = []; if (x.tel) links.push(`<a href="tel:${E(x.tel)}" data-ref="${E(x.label)}">Call</a>`); if (x.whatsapp) links.push(`<a href="https://wa.me/${E(String(x.whatsapp).replace(/[^0-9]/g, ""))}" data-ref="${E(x.label)}" rel="noopener">WhatsApp</a>`); if (x.sms) links.push(`<a href="sms:${E(x.sms)}" data-ref="${E(x.label)}">SMS</a>`); return links.join(" · "); };
  const list = (CFG.REFERRALS || []).concat(CFG.LOCAL_CONTACTS || []).concat(CFG.NATIONAL_LINES || []);
  return list.map(x => `<div class="line"><span>${E(x.label)}<br><span class="muted small">${E(x.note || "")}${x.hours ? " · " + E(x.hours) : ""}</span></span><span class="small" style="text-align:right">${x.value ? E(x.value) + "<br>" : ""}${mk(x)}</span></div>`).join("");
}
views.helpHub = function () {

views.guide = function () {
  Api.event("guide_opened", CFG.AI_ENDPOINT ? "ai" : "local");
  S.chat = S.chat || [];
  const ai = !!CFG.AI_ENDPOINT;
  $app.innerHTML = `<button class="back" data-go="helpHub">‹ Get help</button><h1>The guide</h1>
  <div class="card small"><b>What this is</b><p>${ai ? "An AI assistant. It can make mistakes, it is not a nurse or counsellor, and it cannot diagnose. What you type is sent to an AI service to get a reply, and is not stored by this app. Please do not type names, service numbers or lender details." : "A private guide that runs on your phone. Nothing you type leaves it. It points you to short lessons and to people who can help. It is not a clinician."}</p></div>
  <div id="chat" aria-live="polite"></div>
  <form id="gf" class="row" style="margin-top:10px"><input type="text" id="gi" maxlength="400" autocomplete="off" placeholder="Type what is on your mind" style="flex:3;min-width:0"><button class="btn" style="flex:1">Send</button></form>
  <p class="small muted">If you are in danger or thinking of ending your life, use <button class="link small" data-go="safety">help now</button>.</p>`;
  const chat = document.getElementById("chat");
  const bubble = (who, html) => { const d = document.createElement("div"); d.className = "card"; d.style.cssText = who === "me" ? "margin-left:24px;background:var(--brand-soft)" : "margin-right:24px"; d.innerHTML = html; chat.appendChild(d); d.scrollIntoView({ block: "end" }); return d; };
  const people = `<div class="row" style="margin-top:8px"><button class="btn secondary" data-go="callback" data-reason="mental_health">Talk to a nurse</button><button class="btn secondary" data-go="helpHub">More ways to get help</button></div>`;
  const hello = () => bubble("bot", `Hello. Tell me what is weighing on you, in a few words. For example: <i>I cannot sleep</i>, <i>I owe a lender</i>, <i>exam stress</i>, <i>fights at home</i>. I will point you to something short that helps, and to a person if you want one.`);
  if (!chat.children.length) hello();
  function reply(t) {
    if (CRISIS.test(t)) return `<b>I am glad you said that. You do not have to carry it alone.</b><p class="small">If you might act on these thoughts, please get help now.</p>${safetyBlock("Get help now")}<button class="btn block" data-go="callback" data-reason="mental_health">Ask a nurse to contact me today</button><p class="small muted">Please stay with someone you trust until you have spoken to a person.</p>`;
    if (DANGER.test(t)) return `<b>Your safety comes first.</b><p class="small">If someone is hurting or threatening you, call the police (999 or 112) or the free gender-violence line (1195), or go to the nearest health facility. A nurse can also help you plan next steps.</p>${safetyBlock("If you are not safe")}${people}`;
    const hit = TOPICS.filter(([re]) => re.test(t)).slice(0, 2);
    if (!hit.length) return `Thank you for telling me. I am not sure which topic fits. You can try one of these, or talk to a person.<ul class="clean">${["sleep", "stress", "money", "anger", "alcohol", "loss", "dchs_start"].map(id => { const l = lessonById(id); return l ? `<li><button class="link" data-go="lesson" data-id="${E(id)}">${E(l.title)}</button></li>` : ""; }).join("")}</ul>${people}`;
    return hit.map(([, id, name]) => { const l = lessonById(id); if (!l) return ""; return `<b>${E(name)}</b><p class="small">${E(l.body.slice(0, 2).join(" "))}</p><button class="link" data-go="lesson" data-id="${E(id)}">Read: ${E(l.title)}</button>`; }).join("<hr>") + `<p class="small muted">Feeling this for more than two weeks, or it is getting in the way of duty, studies or home? A nurse can help.</p>` + people;
  }
  document.getElementById("gf").onsubmit = async e => {
    e.preventDefault(); const inp = document.getElementById("gi"), t = inp.value.trim(); if (!t) return; inp.value = ""; bubble("me", E(t)); Api.event("guide_message", null);
    if (CRISIS.test(t) || DANGER.test(t) || !ai) { bubble("bot", reply(t)); return; }          // crisis wording never goes to an AI first: people first
    const wait = bubble("bot", '<span class="muted">Thinking...</span>'); S.chat.push({ role: "user", content: t }); S.chat = S.chat.slice(-8);
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch(CFG.AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: S.chat }), signal: ctl.signal }); clearTimeout(tm);
      if (!r.ok) throw new Error("x"); const j = await r.json(); const txt = String(j.reply || "").slice(0, 1500); if (!txt) throw new Error("x");
      S.chat.push({ role: "assistant", content: txt }); wait.innerHTML = E(txt).replace(/\n/g, "<br>") + people;
    } catch (er) { wait.innerHTML = reply(t); }                                                // if the AI is unreachable, fall back to the on-phone guide
  };
};

/* ================================================================== RESEARCH FORMS (consent first) */
views.studyConsent = function (p) {
  const key = p.form, F = INSTRUMENT[key];
  if (key === "student_screen") return apConsent();
  $app.innerHTML = `${P.grp === "informant" ? "" : `<button class="back" data-go="home">‹ Home</button>`}<h1>${E(F.title)}</h1><p class="muted">About ${F.minutes} minutes</p>
  <div class="card small"><b>About this study</b><p>${E(CFG.STUDY_NAME)} is a research project. It tests a small, confidential mental health service for personnel and families, and asks the people who work with them what is needed.</p>
  <ul class="clean"><li>Taking part is voluntary. You can stop at any time, and it will not affect your service, work, care or family in any way.</li>
   <li>${(key === "informant" || key === "delphi") ? "Your answers are anonymous. Please do not write names or details that could identify a person in free-text boxes." : "No name or service number is collected. Your answers are linked only to a random code on your phone."}</li>
   <li>Results are reported as group findings only. No commander or supervisor sees individual answers.</li>
   <li>Some questions touch on stress, trauma, alcohol, money, loans and violence at home and may be uncomfortable. You may choose Prefer not to say where it is shown, and you can stop at any time. Help numbers are on the Help now page.</li>
   <li>Confidentiality has limits that the ethics committee has set out on your information sheet (for example, immediate danger to someone). The researcher and ethics committee contacts are on that sheet.</li></ul></div>
  <label class="opt"><input type="checkbox" id="ok"><span>I am 18 or older, I have read this, and I agree to take part.</span></label><p class="errmsg" id="cErr" hidden></p><div style="height:10px"></div><button class="btn block" id="go">Start</button>`;
  document.getElementById("go").onclick = () => { if (!document.getElementById("ok").checked) { const e = document.getElementById("cErr"); e.hidden = false; e.textContent = "Please tick the box to continue."; return; } startForm(key, {}); };
};

function apConsent() {
  const ctx = apNext() || "followup"; const F = INSTRUMENT.student_screen;
  $app.innerHTML = `<button class="back" data-go="home">‹ Home</button><h1>${apLabel(ctx)}</h1><p class="muted">About ${F.minutes} minutes</p>
  <div class="card small"><b>What this is</b><p>A research project at the Defence College of Health Sciences tests an online wellbeing check for students (and applicants) of the college. It helps you see how you are doing, find support early, and helps the college plan welfare and counselling. It is <b>not a test you pass or fail</b>.</p>
  <ul class="clean"><li><b>It is not an assessment.</b> Taking part, skipping it or stopping part way changes nothing about your marks, progression, discipline, sponsorship or place. It is not used to decide who is admitted, promoted or removed.</li>
   <li>Your detailed answers and scores go only to the research team, without your name, and are reported as group findings. They are never given to the college, your lecturers, your sponsor or your commander.</li>
   <li>At the end you can <b>choose</b> to share one colour (green, amber or red) with the college student-support office so they can offer help early. You see exactly what is shared first, it is never required, and you can withdraw it later. ${CFG.INTERVIEWER_COLOUR ? "Under the college's approved protocol an interviewer can look up that colour. It must not be used to decide who is admitted." : "Lecturers, commanders and panels do not see it."}</li>
   <li>No name or admission number is collected. You get an anonymous private code on this phone.</li>
   <li>${ctx === "baseline" || ctx === "selection" ? "You may be invited to repeat the check about every 4 weeks. If you agree to follow-up on your consent form, the college registry's designated officer (not your lecturers) can tell the research team only whether you stayed in the programme, using your private code." : "Your earlier answers are linked to these only through your private code."}</li>
   <li>Some questions touch on mood, trauma, alcohol, money and loans, and home. You may choose Prefer not to say where it is shown. Help numbers are on the Help now page.</li>
   <li>If your answers suggest you may be in danger, the app shows help numbers on your screen. Nobody is told unless you choose to ask a nurse to contact you. Limits of confidentiality (for example, immediate danger to someone) are on your information sheet.</li></ul></div>
  <label class="opt"><input type="checkbox" id="ok"><span>I am 18 or older, I have read this, and I agree to take part.</span></label><p class="errmsg" id="cErr" hidden></p><div style="height:10px"></div><button class="btn block" id="go">Start</button>`;
  document.getElementById("go").onclick = () => { if (!document.getElementById("ok").checked) { const e = document.getElementById("cErr"); e.hidden = false; e.textContent = "Please tick the box to continue."; return; } startForm("student_screen", { context: ctx }); };
}

/* ================================================================== SETTINGS */
views.settings = function () {
  $app.innerHTML = `<button class="back" data-go="home">‹ Home</button><h1>Settings</h1>
  <div class="card"><b>My private code</b><p style="font-size:1.3rem;font-weight:700;letter-spacing:1px">${E(P.anon_code)}</p><p class="small muted">This random code is the only link between your answers. It is not your name.</p></div>
  <div class="card"><b>My situation</b><p class="small muted">Change this when your life changes, for example when you finish college and are posted, deploy, return or go on leave. Your private code stays the same, so your history stays with you.</p>
  <fieldset><legend>Where am I now?</legend><select id="sit">${[["", "Not set"], ["college", "At college"], ["base", "In barracks or at base"], ["deployed", "Deployed or in the field"], ["returning", "Back from deployment"], ["leave", "On leave"], ["home", "At home with family"]].map(([v, l]) => `<option value="${v}" ${(P.situation || "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></fieldset>
  <fieldset><legend>I am now</legend><select id="rl">${[["student", "A student or applicant at DCHS"], ["personnel", "Serving personnel"], ["family", "A family member of someone serving"]].filter(x => P.grp !== "informant" && ((CFG.ROLES || ["student"]).includes(x[0]) || x[0] === P.grp)).map(([v, l]) => `<option value="${v}" ${P.grp === v ? "selected" : ""}>${l}</option>`).join("")}</select></fieldset>
  <label class="opt"><input type="checkbox" id="simple" ${P.simple ? "checked" : ""}><span class="small">Simple view: show only the check-in, weekly pulse, get help, ask the nurse and money help.</span></label></div>
  <div class="card"><fieldset><legend>My unit group</legend><select id="unit">${CFG.UNITS.map(u => `<option value="${E(u.code)}" ${P.unit_code === u.code ? "selected" : ""}>${E(u.label)}</option>`).join("")}</select></fieldset>
  <label class="opt"><input type="checkbox" id="cU" ${P.consentUsage ? "checked" : ""}><span class="small">Share anonymous usage counts</span></label><div style="height:8px"></div>
  <label class="opt"><input type="checkbox" id="cA" ${P.consentAnswers ? "checked" : ""}><span class="small">Share my anonymous check-in and pulse answers for the pilot evaluation</span></label></div>
  ${P.share ? `<div class="card"><b>Colour shared with the college</b><p class="small">You shared: ${BAND_NAME[P.share.band]}. <button class="link small" id="wd2">Withdraw</button></p></div>` : ""}
  ${P.grp === "student" ? `${P.apContext === "selection" ? `<div class="card"><b>DCHS applicants</b><p class="small">After admission decisions are final, you can switch to the orientation check. It repeats the same questions when nothing depends on your answers.</p><button class="btn secondary block" id="toOri">I have been admitted: switch to the orientation check</button></div>` : ""}` : ""}
  <div class="card"><b>Lock this app</b><p class="small muted">Optional. A 4 to 6 digit PIN stops other people who pick up your phone from opening your results. It stays on this phone and is never sent anywhere. It does not encrypt your data.</p>
  <div id="pinBox">${Pin.get() ? `<p class="small">PIN lock is on. <button class="link small" id="pinOff">Turn off</button></p>` : `<input id="pinNew" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4 to 6 digits)"> <button class="btn secondary" id="pinSet">Set PIN</button><p id="pinMsg" class="errmsg" hidden></p>`}</div></div>
  <div class="card"><b>Waiting to send</b><p class="small">${Api.pending()} item(s) waiting for a connection. <button class="link small" id="flush">Send now</button></p></div>
  <button class="btn danger block" id="wipe">Delete everything stored on this phone</button><p class="small muted">Version ${E(CFG.APP_VERSION)}, protocol ${E(CFG.PROTOCOL_VERSION)}. Data already sent cannot be linked back to you.</p>`;
  document.getElementById("unit").onchange = e => { P.unit_code = e.target.value; save(); Api.event("situation_changed", "unit"); };
  document.getElementById("sit").onchange = e => { P.situation = e.target.value; save(); Api.event("situation_changed", e.target.value || "unset"); };
  document.getElementById("rl").onchange = e => { const nv = e.target.value; if (nv !== P.grp) { P.grp = nv; if (nv !== "student") P.apContext = null; P.done = P.done || {}; save(); Api.event("role_changed", nv); } };
  document.getElementById("simple").onchange = e => { P.simple = e.target.checked; save(); };
  document.getElementById("cU").onchange = e => { P.consentUsage = e.target.checked; save(); };
  document.getElementById("cA").onchange = e => { P.consentAnswers = e.target.checked; save(); };
  const ps = document.getElementById("pinSet"); if (ps) ps.onclick = async () => { const v = document.getElementById("pinNew").value; const m = document.getElementById("pinMsg"); if (!/^\d{4,6}$/.test(v)) { m.hidden = false; m.textContent = "Use 4 to 6 digits."; return; } await Pin.set(v); UNLOCKED = true; views.settings(); };
  const po = document.getElementById("pinOff"); if (po) po.onclick = () => { Pin.clear(); views.settings(); };
  const w2 = document.getElementById("wd2"); if (w2) w2.onclick = withdrawShare;
  const to = document.getElementById("toOri"); if (to) to.onclick = () => { P.apContext = "orientation"; save(); go("home"); };
  document.getElementById("flush").onclick = async () => { await Api.flush(); views.settings(); };
  document.getElementById("wipe").onclick = () => { if (confirm("Delete your code, drafts, saved requests and settings from this phone?")) { Object.keys(localStorage).filter(k => k.startsWith("salama_") && k !== "salama_demo_db" && k !== "salama_lang").forEach(k => localStorage.removeItem(k)); P = null; location.href = location.pathname; } };
};

/* ================================================================== LIVING CONTENT + START */
async function loadRemote() {
  try { const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 2500); const r = await fetch("content.json?h=" + Math.floor(Date.now() / 36e5), { signal: ctl.signal, cache: "no-cache" }); clearTimeout(tm); if (r.ok) Store.set("salama_content", await r.json()); } catch (e) { }
  const j = Store.get("salama_content", null); if (!j) return;
  if (j.banner) REMOTE.banner = String(j.banner).slice(0, 200);
  if (Array.isArray(j.lessons)) j.lessons.forEach(l => { if (l && l.id && l.title && Array.isArray(l.body)) { const k = LESSONS.findIndex(x => x.id === l.id); const n = { id: String(l.id), title: String(l.title), minutes: Number(l.minutes) || 2, body: l.body.map(String) }; if (k >= 0) LESSONS[k] = n; else LESSONS.push(n); } });
  if (Array.isArray(j.contacts)) CFG.LOCAL_CONTACTS = j.contacts.filter(c => c && c.label);
}
(async function init() {
  if (CFG.BACKEND === "demo") document.getElementById("demo").hidden = false;
  const q = new URLSearchParams(location.search);
  if (P && P.hasProfile && q.get("unit") && CFG.UNITS.find(u => u.code === q.get("unit"))) { P.unit_code = q.get("unit"); save(); }
  try { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js"); } catch (e) { }
  await loadRemote();
  const v = P && P.hasProfile ? (Pin.get() && !UNLOCKED ? "lock" : "home") : "welcome"; history.replaceState({ v, p: {} }, ""); render({ v, p: {} }); Api.flush();
  if (v === "home" && q.get("go") === "survey" && P.grp === "student") go("studyConsent", { form: "student_screen" });
})();
window.__salama = { Pin,  P: () => P, S, go };
</script>
